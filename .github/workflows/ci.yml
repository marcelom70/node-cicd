name: Node CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build image
        run: docker build -t marcelom70/node-cicd:latest .

      - name: Push image
        run: docker push marcelom70/node-cicd:latest

      # - name: Deploy to EC2
      #   uses: appleboy/ssh-action@v1.0.0
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ${{ secrets.EC2_USER }}
      #     key: ${{ secrets.EC2_SSH_KEY }}
      #     script: |
      #       docker pull marcelom70/node-cicd:latest
      #       docker stop node-cicd || true
      #       docker rm node-cicd || true
      #       docker run -d -p 5000:5000 --name node-cicd marcelom70/node-cicd:latest
      - name: Test connectivity
        run: |
          ping -c 2 ${{ secrets.EC2_HOST }} || true
          nc -zv ${{ secrets.EC2_HOST }} 22 || true

      - name: Deploy via SSH (simple)
        run: |
          echo "Start Deploying to EC2 instance"
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem

          echo "Deploying to EC2 instance 1..."
          cat /etc/os-release
          echo "Deploying to EC2 instance 2..."

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo docker pull marcelom70/node-cicd:latest
            sudo docker stop node-cicd || true
            sudo docker rm node-cicd || true
            sudo docker run -d -p 5000:5000 --name node-cicd marcelom70/node-cicd:latest
          EOF